name: 01 - Github action environments Demo

on:
  push:
    branches:
      - "feature/**"
      - "develop"
      - "main"

jobs:
  build-job:
    name: Build & Publish Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_HUB_USERNAME }}/cwvj-flask-app:${{ github.sha }}
            ${{ vars.DOCKER_HUB_USERNAME }}/cwvj-flask-app:latest

  deploy-dev-job:
    name: Deploy to DEV Environment
    if: github.ref_name == 'develop'
    needs: build-job
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Display Branch information
        run: |
          echo "Deploying on branch: ${{ github.ref_name }}"

      - name: Display Environment Configuration
        run: |
          echo "Application URL : ${{ vars.APP_URL }}"
          echo "Debug Mode      : ${{ vars.DEBUG_MODE }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Run Container
        run: |
          docker run -d -p 5000:5000 \
          --name cwj-flask-app \
          ${{ vars.DOCKER_HUB_USERNAME }}/cwvj-flask-app:latest

      - name: Smoke Test DEV
        run: |
          sleep 5
          curl --fail http://127.0.0.1:5000/
          curl --fail http://127.0.0.1:5000/health

      - name: Display Container logs
        run: docker logs cwj-flask-app

  deploy-prod-job:
    name: Deploy to PROD Environment
    if: github.ref_name == 'main'
    needs: build-job
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Display Branch information
        run: |
          echo "Deploying on branch: ${{ github.ref_name }}"

      - name: Display Environment Configuration
        run: |
          echo "Application URL : ${{ vars.APP_URL }}"
          echo "Debug Mode      : ${{ vars.DEBUG_MODE }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Run Container
        run: |
          docker run -d -p 5000:5000 \
          --name cwj-flask-app \
          ${{ vars.DOCKER_HUB_USERNAME }}/cwvj-flask-app:latest

      - name: Smoke Test PROD
        run: |
          sleep 5
          curl --fail http://127.0.0.1:5000/
          curl --fail http://127.0.0.1:5000/health

      - name: Display Container logs
        run: docker logs cwj-flask-app
